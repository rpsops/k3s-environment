---
- name: Load gitops config
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../gitops-config.yaml"

# --- Cilium CNI must be installed before anything else can schedule ---

- name: Install Gateway API CRDs
  ansible.builtin.command: >
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
  register: gwapi_apply
  changed_when: "'configured' in gwapi_apply.stdout or 'created' in gwapi_apply.stdout"

- name: Flush stale Cilium iptables rules (Linux)
  ansible.builtin.shell: |
    sudo iptables -t nat -F OLD_CILIUM_POST_nat 2>/dev/null || true
    sudo iptables -t nat -X OLD_CILIUM_POST_nat 2>/dev/null || true
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Check if Cilium is installed
  ansible.builtin.command: helm status cilium -n kube-system
  register: cilium_check
  changed_when: false
  failed_when: false

- name: Install Cilium via Helm (CNI bootstrap - before Flux)
  when: cilium_check.rc != 0
  block:
    - name: Add Cilium Helm repo
      ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
      changed_when: false

    - name: Install Cilium
      ansible.builtin.command: >
        helm install cilium cilium/cilium
        --namespace kube-system
        --set operator.replicas=1
        --set ipam.mode=kubernetes
        --set kubeProxyReplacement=true
        --set k8sServiceHost=localhost
        --set k8sServicePort=6443
        --set gatewayAPI.enabled=true
        --set l2announcements.enabled=true
        --set externalIPs.enabled=true
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        --set hubble.metrics.enabled="{dns,drop,tcp,flow,icmp,http}"
        --set hubble.metrics.serviceMonitor.enabled=false
      changed_when: true

- name: Wait for nodes to be Ready (Cilium CNI active)
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready nodes --all --timeout=120s
  changed_when: false
  retries: 6
  delay: 15
  register: nodes_ready
  until: nodes_ready.rc == 0

# --- Flux ---

- name: Install Flux controllers (with image automation)
  ansible.builtin.command: >
    flux install
    --components-extra=image-reflector-controller,image-automation-controller
  register: flux_install
  changed_when: "'configured' in flux_install.stdout or 'created' in flux_install.stdout or flux_install.changed"

- name: Wait for Flux controllers to be ready
  ansible.builtin.command: flux check
  changed_when: false
  retries: 6
  delay: 10
  register: flux_check
  until: flux_check.rc == 0

# --- Infrastructure: sources + namespaces ---

- name: Apply HelmRepository sources
  ansible.builtin.command: kubectl apply -k {{ flux_base_path }}/infrastructure/sources
  register: sources_apply
  changed_when: "'configured' in sources_apply.stdout or 'created' in sources_apply.stdout"

- name: Apply namespaces
  ansible.builtin.command: kubectl apply -k {{ flux_base_path }}/infrastructure/namespaces
  register: ns_apply
  changed_when: "'configured' in ns_apply.stdout or 'created' in ns_apply.stdout"

- name: Flush stale Cilium iptables rules before Helm fetches (Linux)
  ansible.builtin.shell: |
    sudo iptables -t nat -F OLD_CILIUM_POST_nat 2>/dev/null || true
    sudo iptables -t nat -X OLD_CILIUM_POST_nat 2>/dev/null || true
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Force reconcile all Helm repositories
  ansible.builtin.shell: |
    flux reconcile source helm --all 2>/dev/null || true
    sleep 5
  changed_when: false

- name: Verify DNS works inside cluster (Linux)
  ansible.builtin.shell: |
    kubectl run dns-verify --rm -i --restart=Never --image=busybox --timeout=30s -- \
      nslookup charts.jetstack.io 2>&1 | tail -3
  register: dns_verify
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Fix CoreDNS if DNS is broken (Linux)
  when: "ansible_facts['os_family'] == 'Debian' and dns_verify.rc is defined and dns_verify.rc != 0"
  ansible.builtin.shell: |
    sudo iptables -t nat -F OLD_CILIUM_POST_nat 2>/dev/null || true
    sudo iptables -t nat -X OLD_CILIUM_POST_nat 2>/dev/null || true
    kubectl rollout restart daemonset cilium -n kube-system
    kubectl rollout restart deployment coredns -n kube-system
    sleep 20
    flux reconcile source helm --all 2>/dev/null || true

# --- cert-manager ---

- name: Apply cert-manager HelmRelease
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/cert-manager"
  register: cm_apply
  changed_when: "'configured' in cm_apply.stdout or 'created' in cm_apply.stdout"

- name: Wait for cert-manager to be ready
  ansible.builtin.command: flux get helmrelease cert-manager -n cert-manager
  changed_when: false
  retries: 15
  delay: 20
  register: cm_ready
  until: "'True' in cm_ready.stdout"

- name: Get mkcert CA root path
  ansible.builtin.command: mkcert -CAROOT
  register: mkcert_caroot
  changed_when: false

- name: Apply ClusterIssuer for mkcert CA
  ansible.builtin.command: kubectl apply -f {{ flux_base_path }}/infrastructure/cert-manager/clusterissuer.yaml
  register: ci_apply
  changed_when: "'configured' in ci_apply.stdout or 'created' in ci_apply.stdout"

- name: Create mkcert CA secret in cert-manager namespace
  ansible.builtin.shell: |
    kubectl create secret tls mkcert-ca \
      --cert="{{ mkcert_caroot.stdout }}/rootCA.pem" \
      --key="{{ mkcert_caroot.stdout }}/rootCA-key.pem" \
      -n cert-manager --dry-run=client -o yaml | kubectl apply -f -
  register: ca_secret
  changed_when: "'configured' in ca_secret.stdout or 'created' in ca_secret.stdout"

- name: Copy mkcert CA to Lima VM trust store
  ansible.builtin.shell: |
    limactl shell {{ lima_vm_name }} sudo bash -c '
      mkdir -p /usr/local/share/ca-certificates
      cat > /usr/local/share/ca-certificates/mkcert-ca.crt << EOFCERT
    {{ lookup("file", mkcert_caroot.stdout + "/rootCA.pem") }}
    EOFCERT
      update-ca-certificates
    '
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Copy mkcert CA to Linux trust store
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Copy CA certificate
      ansible.builtin.copy:
        src: "{{ mkcert_caroot.stdout }}/rootCA.pem"
        dest: /usr/local/share/ca-certificates/mkcert-ca.crt
        mode: "0644"
      become: true

    - name: Update CA certificates
      ansible.builtin.command: update-ca-certificates
      become: true
      changed_when: false

# --- Sealed Secrets ---

- name: Check for saved sealed-secrets master key
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/sealed-secrets-master.key.yaml"
  register: ss_key_file

- name: Check if active sealed-secrets key already exists in cluster
  ansible.builtin.shell: |
    kubectl get secret -n kube-system \
      -l sealedsecrets.bitnami.com/sealed-secrets-key=active \
      -o name 2>/dev/null | wc -l | tr -d ' '
  register: ss_key_in_cluster
  changed_when: false

- name: Restore sealed-secrets master key from .local/ (only if absent in cluster)
  when:
    - ss_key_file.stat.exists
    - ss_key_in_cluster.stdout | int == 0
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../.local/sealed-secrets-master.key.yaml
  register: ss_key_restore
  changed_when: "'configured' in ss_key_restore.stdout or 'created' in ss_key_restore.stdout"

- name: Notice when no saved sealed-secrets key is available
  when: not ss_key_file.stat.exists
  ansible.builtin.debug:
    msg: >-
      No .local/sealed-secrets-master.key.yaml found.
      The controller will generate a fresh key on first start.
      Run 'make sealed-secrets-key-export' to persist it for future rebuilds.

- name: Apply sealed-secrets
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/sealed-secrets"
  register: ss_apply
  changed_when: "'configured' in ss_apply.stdout or 'created' in ss_apply.stdout"

- name: Wait for sealed-secrets controller to be ready
  ansible.builtin.command: flux get helmrelease sealed-secrets -n kube-system
  changed_when: false
  retries: 20
  delay: 15
  register: ss_ready
  until: "'True' in ss_ready.stdout"

# --- Seal secrets ---

- name: Check if Grafana admin secret exists
  ansible.builtin.command: kubectl get secret grafana-admin -n monitoring
  register: grafana_admin_secret
  changed_when: false
  failed_when: false

- name: Generate and seal Grafana admin secret
  when: grafana_admin_secret.rc != 0
  ansible.builtin.shell: |
    PASSWORD=$(openssl rand -base64 16)
    kubectl create secret generic grafana-admin \
      --from-literal=username=admin \
      --from-literal=password="$PASSWORD" \
      -n monitoring --dry-run=client -o yaml | \
    kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system --format yaml | kubectl apply -f -
  changed_when: true

# --- Deploy remaining infrastructure ---

- name: Apply infrastructure components (first pass)
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/{{ item }}"
  loop:
    - garage
    - monitoring
    - strimzi
    - registry
    - kyverno
  register: infra_apply
  changed_when: "'configured' in infra_apply.stdout or 'created' in infra_apply.stdout"
  failed_when: false

- name: Wait for infrastructure HelmReleases to be ready
  ansible.builtin.shell: |
    flux get helmreleases -A --no-header 2>/dev/null | grep -cv "True" || echo "0"
  register: hr_not_ready
  changed_when: false
  retries: 30
  delay: 20
  until: hr_not_ready.stdout | trim | int == 0
  failed_when: false

- name: Apply infrastructure components (second pass - CRDs now available)
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/{{ item }}"
  loop:
    - cilium
    - monitoring
  register: infra_apply2
  changed_when: "'configured' in infra_apply2.stdout or 'created' in infra_apply2.stdout"

# --- Update dnsmasq with Gateway IP on Linux ---

- name: Get Gateway external IP (Linux)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.shell: >
    kubectl get gateway dev-local -o jsonpath='{.status.addresses[0].value}'
  register: gateway_ip
  changed_when: false
  retries: 10
  delay: 10
  until: gateway_ip.stdout | length > 0

- name: Update dnsmasq with Gateway IP (Linux)
  when: ansible_facts['os_family'] == "Debian" and gateway_ip.stdout | length > 0
  block:
    - name: Set Gateway IP in dnsmasq config
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.d/dev-local.conf
        regexp: '^address='
        line: "address=/dev.local/{{ gateway_ip.stdout }}"
      become: true
      register: dnsmasq_updated

    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
      become: true
      when: dnsmasq_updated.changed

    - name: Restart systemd-resolved (if active)
      ansible.builtin.shell: systemctl is-active systemd-resolved && systemctl restart systemd-resolved || true
      become: true
      changed_when: false
      when: dnsmasq_updated.changed

# --- GitOps namespace entries ---

- name: Default namespaces to empty list
  ansible.builtin.set_fact:
    namespaces: "{{ namespaces | default([]) }}"

- name: Skip GitOps setup when no namespaces are configured
  ansible.builtin.debug:
    msg: >-
      gitops-config.yaml has no entries in 'namespaces:'.
      No Flux GitRepositories or Kustomizations will be applied.
      Add an entry with: make namespace NAME=<ns> URL=<https-url>
        GITOPS_USER=<user> GITOPS_TOKEN=<pat>
  when: namespaces | length == 0

- name: Validate namespace entries
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.url is defined
      - item.url | length > 0
    fail_msg: "Each entry in 'namespaces:' requires non-empty 'name' and 'url'."
  loop: "{{ namespaces }}"

- name: Assert namespace names are unique
  ansible.builtin.assert:
    that:
      - (namespaces | map(attribute='name') | list | unique | length) == (namespaces | length)
    fail_msg: "Duplicate name found in 'namespaces:' list."
  when: namespaces | length > 0

- name: Check for saved gitops credentials per entry
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/gitops-credentials-{{ item.name }}.yaml"
  loop: "{{ namespaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: gitops_creds_files

- name: Check if per-entry gitops-credentials Secrets exist in cluster
  ansible.builtin.command: kubectl get secret gitops-credentials-{{ item.name }} -n flux-system
  loop: "{{ namespaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: gitops_creds_in_cluster
  changed_when: false
  failed_when: false

- name: Restore per-entry gitops-credentials from .local/ (only if absent in cluster)
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../.local/gitops-credentials-{{ item.0.item.name }}.yaml
  loop: "{{ gitops_creds_in_cluster.results | zip(gitops_creds_files.results) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}"
  when:
    - item.0.rc != 0
    - item.1.stat.exists
  register: gitops_creds_restore
  changed_when: "'configured' in gitops_creds_restore.stdout or 'created' in gitops_creds_restore.stdout"

- name: Fail when a gitops-credentials Secret is missing for any entry
  ansible.builtin.fail:
    msg: |
      No Secret/gitops-credentials-{{ item.0.item.name }} in flux-system and no
      .local/gitops-credentials-{{ item.0.item.name }}.yaml available to restore from.

      Run:
        make namespace NAME={{ item.0.item.name }} URL={{ item.0.item.url }} \
          GITOPS_USER=<user> GITOPS_TOKEN=<pat>

      The PAT needs repo read + write (write is required by Flux Image
      Update Automation).
  loop: "{{ gitops_creds_in_cluster.results | zip(gitops_creds_files.results) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}"
  when:
    - item.0.rc != 0
    - not item.1.stat.exists

- name: Apply GitOps entries (Namespace + GitRepository + Kustomization per entry)
  ansible.builtin.shell: |
    cat <<'EOF' | kubectl apply -f -
    {{ lookup('template', 'gitops-entries.yaml.j2') }}
    EOF
  register: gitops_entries_apply
  changed_when: "'configured' in gitops_entries_apply.stdout or 'created' in gitops_entries_apply.stdout"
  when: namespaces | length > 0

- name: Wait for each GitRepository source to be ready
  ansible.builtin.command: flux get source git {{ item.name }}
  loop: "{{ namespaces }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  retries: 10
  delay: 10
  register: gitops_source_status
  until: "'True' in gitops_source_status.stdout"

# --- Build infrastructure + cosign ---

- name: Apply build infrastructure
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/builds"
  register: builds_apply
  changed_when: "'configured' in builds_apply.stdout or 'created' in builds_apply.stdout"
  failed_when: false

- name: Check for saved cosign signing key
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/cosign-key.yaml"
  register: cosign_key_file

- name: Check if cosign-key Secret already exists in cluster
  ansible.builtin.command: kubectl get secret cosign-key -n flux-system
  register: cosign_key_in_cluster
  changed_when: false
  failed_when: false

- name: Restore cosign signing key from .local/ (only if absent in cluster)
  when:
    - cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../.local/cosign-key.yaml
  register: cosign_key_restore
  changed_when: "'configured' in cosign_key_restore.stdout or 'created' in cosign_key_restore.stdout"

- name: Notice when no saved cosign key is available
  when:
    - not cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.debug:
    msg: >-
      No .local/cosign-key.yaml found.
      A fresh cosign keypair will be generated.
      Existing image signatures from prior clusters will not verify.
      Run 'make cosign-key-export' to persist it for future rebuilds.

- name: Generate cosign key pair if not exists
  ansible.builtin.shell: |
    if ! kubectl get secret cosign-key -n flux-system >/dev/null 2>&1; then
      COSIGN_PASSWORD="" cosign generate-key-pair k8s://flux-system/cosign-key
      echo "created"
    else
      echo "exists"
    fi
  register: cosign_key
  changed_when: "'created' in cosign_key.stdout"

# --- Status ---

- name: Show status
  ansible.builtin.shell: |
    echo "=== Git Sources ==="
    flux get sources git
    echo ""
    echo "=== Kustomizations ==="
    flux get kustomizations
    echo ""
    echo "=== HelmReleases ==="
    flux get helmreleases -A
  register: final_status
  changed_when: false

- name: Display status
  ansible.builtin.debug:
    var: final_status.stdout_lines
