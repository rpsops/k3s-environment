apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: "*"
    helm:
      values: |
        config:
          registries:
            - name: zot
              prefix: zot.registry.svc.cluster.local:5000
              api_url: http://zot.registry.svc.cluster.local:5000
              insecure: true
              default: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
