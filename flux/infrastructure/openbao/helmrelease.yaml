apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  values:
    server:
      standalone:
        enabled: true
        config: |
          ui = false
          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = true
          }
          storage "file" {
            path = "/openbao/data"
          }

      dataStorage:
        enabled: true
        size: 1Gi

      # Report ready even when sealed so kubectl exec works during init/unseal
      readinessProbe:
        enabled: true
        path: /v1/sys/health?standbyok=true&sealedok=true&uninitok=true

    # Agent injector not needed — ESO handles secret sync
    injector:
      enabled: false

    ui:
      enabled: false
