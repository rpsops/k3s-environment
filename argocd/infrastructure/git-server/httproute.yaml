apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-server
  namespace: git-server
spec:
  parentRefs:
    - name: dev-local
      namespace: default
      sectionName: http
  hostnames:
    - git.dev.local
  rules:
    - backendRefs:
        - name: git-server
          port: 80
