apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 24h
  chart:
    spec:
      chart: gitea
      version: ">=10.0.0 <11.0.0"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
  values:
    # Disable bundled databases — use SQLite for local dev
    postgresql-ha:
      enabled: false
    postgresql:
      enabled: false
    redis-cluster:
      enabled: false

    gitea:
      config:
        database:
          DB_TYPE: sqlite3
        server:
          DOMAIN: gitea.dev.local
          ROOT_URL: https://gitea.dev.local
          # Disable SSH — HTTPS only for local dev
          DISABLE_SSH: true
        repository:
          DEFAULT_BRANCH: main

    persistence:
      enabled: true
      size: 100Mi

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
