apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      containers:
        - name: git-server
          image: k3s-gitserver:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: repos
              mountPath: /repos
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: git-repos
