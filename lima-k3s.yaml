# Lima VM configuration for k3s
# This replaces the previous Colima setup

# VM resources - matching previous Colima configuration
cpus: 4
memory: "16GiB"
disk: "100GiB"

# Operating system image
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Mount project directory for access to k8s manifests
mounts:
  - location: "~"
    writable: false

# Containerd runtime configuration
containerd:
  system: false
  user: false

# Port forwarding for k8s services
portForwards:
  # Kubernetes API server — bound to 0.0.0.0 so k3s-toolbox container can reach it via host.docker.internal
  - guestPort: 6443
    hostPort: 6443
    hostIP: "0.0.0.0"
    proto: tcp
  # HTTP/HTTPS ingress: socat inside the VM listens on 18080/18443 and forwards
  # to the Cilium Gateway NodePort. Offset ports prevent Lima from racing
  # Cilium Envoy (which briefly binds 0.0.0.0:8080/8443 during listener setup).
  # Explicit per-IP ignore rules are required; guestPortRange catch-all does not
  # match 0.0.0.0 events, so Lima would auto-forward Envoy's ports and steal
  # Mac:8080/8443 before socat's 18080/18443 rules get a chance.
  - guestIP: "0.0.0.0"
    guestPort: 8080
    ignore: true
  - guestIP: "::"
    guestPort: 8080
    ignore: true
  - guestIP: "127.0.0.1"
    guestPort: 8080
    ignore: true
  - guestIP: "0.0.0.0"
    guestPort: 8443
    ignore: true
  - guestIP: "::"
    guestPort: 8443
    ignore: true
  - guestIP: "127.0.0.1"
    guestPort: 8443
    ignore: true
  - guestIP: "0.0.0.0"
    guestPort: 18080
    hostPort: 8080
    proto: tcp
  - guestIP: "0.0.0.0"
    guestPort: 18443
    hostPort: 8443
    proto: tcp
  # Belt-and-suspenders: suppress all other auto-forwards.
  - guestPortRange: [1, 65535]
    ignore: true

# Provisioning scripts to install and configure k3s
provision:
  # System-level provisioning (runs as root)
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # socat bridges Lima's port-forwards (18080/18443) to the Cilium Gateway
      # NodePorts. The script polls k3s until the service has a NodePort, then
      # hands off to socat. Using offset guest ports (18080/18443) avoids any
      # conflict if a future Cilium version binds 0.0.0.0:8080/8443 directly.
      apt-get install -y --no-install-recommends socat

      base64 -d > /usr/local/bin/k3s-port-forward.sh << 'EOF'
      
      EOF
      chmod +x /usr/local/bin/k3s-port-forward.sh

      for PAIR in "18080:8080" "18443:8443"; do
        GUEST="${PAIR%%:*}"
        SVC_PORT="${PAIR##*:}"
        printf '[Unit]\nDescription=Forward guest:%s to Cilium Gateway NodePort for svc:%s\nAfter=k3s.service\nWants=k3s.service\n\n[Service]\nExecStart=/usr/local/bin/k3s-port-forward.sh %s %s\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' \
          "$GUEST" "$SVC_PORT" "$GUEST" "$SVC_PORT" \
          > /etc/systemd/system/k3s-port-forward-${GUEST}.service
      done
      systemctl daemon-reload
      for GUEST in 18080 18443; do
        systemctl enable k3s-port-forward-${GUEST}
      done

      # systemd-logind spins at ~100% CPU in this VM (virtual input device
      # event loop issue); not needed for a headless k3s node.
      systemctl mask systemd-logind.service
      systemctl stop systemd-logind.service || true

      # Increase inotify limits for in-cluster services
      echo "fs.inotify.max_user_instances=512" > /etc/sysctl.d/99-inotify.conf
      echo "fs.inotify.max_user_watches=524288" >> /etc/sysctl.d/99-inotify.conf
      sysctl --system

      # Configure k3s registry mirror so containerd (running on the node) can
      # resolve zot.registry.svc.cluster.local:5000 — a Kubernetes DNS name only
      # resolvable inside pods, not by the node's system resolver.  We map it to
      # the Zot NodePort (fixed at 30500 via the Zot HelmRelease service.nodePort).
      mkdir -p /etc/rancher/k3s
      printf 'mirrors:\n  "zot.registry.svc.cluster.local:5000":\n    endpoint:\n      - "http://localhost:30500"\nconfigs:\n  "zot.registry.svc.cluster.local:5000":\n    tls:\n      insecure: true\n' \
        > /etc/rancher/k3s/registries.yaml

      # Install k3s if not already installed
      if [ ! -f /usr/local/bin/k3s ]; then
        echo "Installing k3s..."
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --flannel-backend=none --disable-network-policy --disable-kube-proxy --write-kubeconfig-mode 644 --tls-san host.docker.internal" sh -
      else
        echo "k3s already installed, skipping..."
      fi

      # Ensure k3s is running
      systemctl enable k3s --now
      
      # Wait for k3s to be ready
      echo "Waiting for k3s to be ready..."
      for i in {1..30}; do
        if k3s kubectl get nodes &>/dev/null; then
          echo "k3s is ready!"
          break
        fi
        echo "Waiting for k3s... ($i/30)"
        sleep 2
      done
      
      # Start port-forward services (will block until gateway NodePort appears)
      for GUEST in 18080 18443; do
        systemctl start k3s-port-forward-${GUEST} || true
      done

      # Ensure containerd socket is accessible
      chmod 666 /run/k3s/containerd/containerd.sock || true
      
      # Detect architecture
      ARCH=$(uname -m)
      if [ "$ARCH" = "x86_64" ]; then
        ARCH_SUFFIX="amd64"
      elif [ "$ARCH" = "aarch64" ]; then
        ARCH_SUFFIX="arm64"
      else
        echo "Unsupported architecture: $ARCH"
        exit 1
      fi
      
      # Install nerdctl if not already installed
      if [ ! -f /usr/local/bin/nerdctl ]; then
        echo "Installing nerdctl..."
        NERDCTL_VERSION="2.0.3"
        curl -fsSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-${ARCH_SUFFIX}.tar.gz" | \
          tar -xz -C /usr/local/bin nerdctl
        chmod +x /usr/local/bin/nerdctl
        echo "nerdctl installed successfully"
      else
        echo "nerdctl already installed, skipping..."
      fi
      
      # Install buildkit if not already installed
      if [ ! -f /usr/local/bin/buildkitd ]; then
        echo "Installing buildkit..."
        BUILDKIT_VERSION="0.17.1"
        curl -fsSL "https://github.com/moby/buildkit/releases/download/v${BUILDKIT_VERSION}/buildkit-v${BUILDKIT_VERSION}.linux-${ARCH_SUFFIX}.tar.gz" | \
          tar -xz -C /usr/local
        chmod +x /usr/local/bin/buildkitd /usr/local/bin/buildctl
        echo "buildkit installed successfully"
      else
        echo "buildkit already installed, skipping..."
      fi
      
      # Create buildkit socket directory
      mkdir -p /run/buildkit
      
      # Create buildkitd systemd service
      if [ ! -f /etc/systemd/system/buildkit.service ]; then
        echo "Creating buildkitd systemd service..."
        printf '[Unit]\nDescription=BuildKit\nDocumentation=https://github.com/moby/buildkit\nAfter=k3s.service\nRequires=k3s.service\n\n[Service]\nType=simple\nExecStart=/usr/local/bin/buildkitd --containerd-worker-addr /run/k3s/containerd/containerd.sock --addr unix:///run/buildkit/buildkitd.sock\nRestart=always\nRestartSec=5\nStandardOutput=append:/var/log/buildkitd.log\nStandardError=append:/var/log/buildkitd.log\n\n[Install]\nWantedBy=multi-user.target\n' \
          > /etc/systemd/system/buildkit.service
        systemctl daemon-reload
        systemctl enable buildkit
        echo "buildkitd systemd service created"
      fi
      
      # Start buildkitd
      systemctl start buildkit
      echo "buildkitd service started"
      
      echo "k3s installation complete"

  # User-level provisioning
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Create .kube directory
      mkdir -p ~/.kube
      
      # Copy kubeconfig
      if [ -f /etc/rancher/k3s/k3s.yaml ]; then
        sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
        sudo chown $(id -u):$(id -g) ~/.kube/config
        chmod 600 ~/.kube/config
      fi
      
      echo "User provisioning complete"

# Probe scripts to check if VM is ready
probes:
  - mode: readiness
    description: "k3s to be ready"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      k3s kubectl get nodes >/dev/null 2>&1
    hint: |
      k3s is not ready yet. Run 'limactl shell k3s sudo systemctl status k3s' to check the status.

# Enable host DNS resolution
hostResolver:
  enabled: true
  hosts:
    host.lima.internal: host.lima.internal
