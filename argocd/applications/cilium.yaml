apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: ">=1.0.0 <2.0.0"
    helm:
      values: |
        operator:
          replicas: 1
        ipam:
          mode: kubernetes
        kubeProxyReplacement: "true"
        socketLB:
          enabled: true
        k8sServiceHost: "localhost"
        k8sServicePort: "6443"
        gatewayAPI:
          enabled: true
          hostNetwork:
            enabled: true
        l2announcements:
          enabled: true
        externalIPs:
          enabled: true
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
          metrics:
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - icmp
              - http
            serviceMonitor:
              enabled: true
              labels:
                release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
