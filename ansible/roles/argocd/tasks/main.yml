---
- name: Wait for nodes to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready nodes --all --timeout=120s
  changed_when: false
  retries: 6
  delay: 15
  register: nodes_ready
  until: nodes_ready.rc == 0

# --- ArgoCD ---

- name: Add ArgoCD Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install ArgoCD
  ansible.builtin.shell: |
    helm upgrade --install argocd argo/argo-cd \
      --namespace argocd --create-namespace \
      --set 'configs.params.server\.insecure=true' \
      --wait --timeout 5m
  register: argocd_install
  changed_when: "'STATUS: deployed' in argocd_install.stdout or 'has been upgraded' in argocd_install.stdout or argocd_install.changed"

- name: Ensure argocd-cm exists (required by argocd CLI --core mode)
  ansible.builtin.shell: |
    kubectl get cm argocd-cm -n argocd >/dev/null 2>&1 || \
    kubectl create configmap argocd-cm -n argocd
  changed_when: false

# --- Infrastructure: namespaces (imperative bootstrap) ---

- name: Apply namespaces
  ansible.builtin.command: kubectl apply -k {{ argocd_base_path }}/infrastructure/namespaces
  register: ns_apply
  changed_when: "'configured' in ns_apply.stdout or 'created' in ns_apply.stdout"

- name: Verify DNS works inside cluster
  ansible.builtin.shell: |
    kubectl run dns-verify --rm -i --restart=Never --image=busybox --timeout=30s -- \
      nslookup charts.jetstack.io 2>&1 | tail -3
  register: dns_verify
  changed_when: false
  failed_when: false

- name: Fix CoreDNS if DNS is broken
  when: "dns_verify.rc is defined and dns_verify.rc != 0"
  ansible.builtin.shell: |
    kubectl rollout restart deployment coredns -n kube-system
    sleep 20

# --- Gateway API CRDs (bootstrap - required by git-server HTTPRoute) ---

- name: Install Gateway API CRDs
  ansible.builtin.command: >
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
  register: gwapi_apply
  changed_when: "'configured' in gwapi_apply.stdout or 'created' in gwapi_apply.stdout"

# --- git-server (bootstrap - must precede root app) ---

- name: Deploy git-server namespace
  ansible.builtin.command: kubectl apply -f {{ argocd_base_path }}/infrastructure/git-server/namespace.yaml
  register: gs_ns_apply
  changed_when: "'configured' in gs_ns_apply.stdout or 'created' in gs_ns_apply.stdout"

- name: Deploy git-server
  ansible.builtin.command: kubectl apply -f {{ argocd_base_path }}/infrastructure/git-server/
  register: gs_apply
  changed_when: "'configured' in gs_apply.stdout or 'created' in gs_apply.stdout"

- name: Wait for git-server
  ansible.builtin.command: >
    kubectl wait deploy/git-server -n git-server
    --for=condition=available --timeout=120s
  changed_when: false

- name: Init infra bare repo on git-server
  ansible.builtin.shell: |
    POD=$(kubectl get pod -n git-server -l app=git-server -o jsonpath='{.items[0].metadata.name}')
    kubectl exec -n git-server $POD -- bash -c \
      "[ -d /repos/infra ] && echo exists || (git init --bare /repos/infra && echo created)"
  register: repo_init
  changed_when: "'created' in repo_init.stdout"

- name: Push argocd to git-server
  when: "'created' in repo_init.stdout"
  ansible.builtin.shell: |
    POD=$(kubectl get pod -n git-server -l app=git-server -o jsonpath='{.items[0].metadata.name}')
    kubectl cp {{ argocd_base_path }}/ git-server/${POD}:/tmp/argocd-src/
    kubectl exec -n git-server $POD -- bash -c "
      rm -rf /tmp/infra-push && mkdir /tmp/infra-push && cd /tmp/infra-push &&
      git init && git config user.email 'bootstrap@localhost' && git config user.name 'bootstrap' &&
      cp -r /tmp/argocd-src/. . &&
      git add . && git commit -m 'bootstrap' &&
      git push /repos/infra HEAD:main --force &&
      chown -R www-data:www-data /repos/infra
    "
  changed_when: true

- name: Apply root app
  ansible.builtin.command: kubectl apply -f {{ argocd_base_path }}/root-app.yaml
  register: root_apply
  changed_when: "'configured' in root_apply.stdout or 'created' in root_apply.stdout"

# --- mkcert CA ---

- name: Get mkcert CA root path
  ansible.builtin.command: mkcert -CAROOT
  register: mkcert_caroot
  changed_when: false

- name: Ensure mkcert CA exists
  ansible.builtin.command: mkcert -install
  args:
    creates: "{{ mkcert_caroot.stdout }}/rootCA.pem"
  changed_when: false
  environment:
    TRUST_STORES: nss

# --- Sealed Secrets ---

- name: Check for saved sealed-secrets master key
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/sealed-secrets-master.key.yaml"
  register: ss_key_file

- name: Check if active sealed-secrets key already exists in cluster
  ansible.builtin.shell: |
    kubectl get secret -n kube-system \
      -l sealedsecrets.bitnami.com/sealed-secrets-key=active \
      -o name 2>/dev/null | wc -l | tr -d ' '
  register: ss_key_in_cluster
  changed_when: false

- name: Restore sealed-secrets master key from .local/ (only if absent in cluster)
  when:
    - ss_key_file.stat.exists
    - ss_key_in_cluster.stdout | int == 0
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../.local/sealed-secrets-master.key.yaml
  register: ss_key_restore
  changed_when: "'configured' in ss_key_restore.stdout or 'created' in ss_key_restore.stdout"

- name: Notice when no saved sealed-secrets key is available
  when: not ss_key_file.stat.exists
  ansible.builtin.debug:
    msg: >-
      No .local/sealed-secrets-master.key.yaml found.
      The controller will generate a fresh key on first start.
      Run 'make sealed-secrets-key-export' to persist it for future rebuilds.

# --- Wait for cert-manager (ArgoCD wave 0) then apply CA secret ---

- name: Wait for cert-manager (ArgoCD wave 0)
  ansible.builtin.shell: |
    for i in $(seq 1 30); do
      if kubectl get deploy/cert-manager-webhook -n cert-manager >/dev/null 2>&1; then
        kubectl wait deploy/cert-manager-webhook -n cert-manager \
          --for=condition=available --timeout=300s && exit 0
      fi
      sleep 20
    done
    exit 1
  changed_when: false

- name: Create mkcert CA secret in cert-manager namespace
  ansible.builtin.shell: |
    kubectl create secret tls mkcert-ca \
      --cert="{{ mkcert_caroot.stdout }}/rootCA.pem" \
      --key="{{ mkcert_caroot.stdout }}/rootCA-key.pem" \
      -n cert-manager --dry-run=client -o yaml | kubectl apply -f -
  register: ca_secret
  changed_when: "'configured' in ca_secret.stdout or 'created' in ca_secret.stdout"

# --- Wait for sealed-secrets (ArgoCD wave 1) then seal secrets ---

- name: Wait for sealed-secrets (ArgoCD wave 1)
  ansible.builtin.shell: |
    for i in $(seq 1 30); do
      if kubectl get deploy/sealed-secrets -n kube-system >/dev/null 2>&1; then
        kubectl wait deploy/sealed-secrets -n kube-system \
          --for=condition=available --timeout=300s && exit 0
      fi
      sleep 20
    done
    exit 1
  changed_when: false

- name: Check if Grafana admin secret exists
  ansible.builtin.command: kubectl get secret grafana-admin -n monitoring
  register: grafana_admin_secret
  changed_when: false
  failed_when: false

- name: Generate and seal Grafana admin secret
  when: grafana_admin_secret.rc != 0
  ansible.builtin.shell: |
    PASSWORD=$(openssl rand -base64 16)
    kubectl create secret generic grafana-admin \
      --from-literal=username=admin \
      --from-literal=password="$PASSWORD" \
      -n monitoring --dry-run=client -o yaml | \
    kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system --format yaml | kubectl apply -f -
  changed_when: true

# --- Cosign ---

- name: Check for saved cosign signing key
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/cosign-key.yaml"
  register: cosign_key_file

- name: Check if cosign-key Secret already exists in cluster
  ansible.builtin.command: kubectl get secret cosign-key -n argocd
  register: cosign_key_in_cluster
  changed_when: false
  failed_when: false

- name: Restore cosign signing key from .local/ (only if absent in cluster)
  when:
    - cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.shell: |
    sed 's/^\( *namespace:\) .*/\1 argocd/' {{ playbook_dir }}/../.local/cosign-key.yaml \
      | kubectl apply -f -
  register: cosign_key_restore
  changed_when: "'configured' in cosign_key_restore.stdout or 'created' in cosign_key_restore.stdout"

- name: Notice when no saved cosign key is available
  when:
    - not cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.debug:
    msg: >-
      No .local/cosign-key.yaml found.
      A fresh cosign keypair will be generated.
      Run 'make cosign-key-export' to persist it for future rebuilds.

- name: Generate cosign key pair if not exists
  ansible.builtin.shell: |
    if ! kubectl get secret cosign-key -n argocd >/dev/null 2>&1; then
      COSIGN_PASSWORD="" cosign generate-key-pair k8s://argocd/cosign-key
      echo "created"
    else
      echo "exists"
    fi
  register: cosign_key
  changed_when: "'created' in cosign_key.stdout"

# --- Wait for Gateway ---

- name: Wait for Gateway service to obtain ClusterIP
  ansible.builtin.shell: |
    for i in $(seq 1 150); do
      IP=$(kubectl get svc dev-local-istio -n default -o jsonpath='{.spec.clusterIP}' 2>/dev/null || \
           kubectl get svc cilium-gateway-dev-local -n default -o jsonpath='{.spec.clusterIP}' 2>/dev/null)
      if [ -n "$IP" ] && [ "$IP" != "None" ]; then
        exit 0
      fi
      sleep 2
    done
    exit 1
  changed_when: false

# --- Status ---

- name: Show status
  ansible.builtin.shell: kubectl get applications -n argocd
  register: final_status
  changed_when: false
  failed_when: false

- name: Display status
  ansible.builtin.debug:
    var: final_status.stdout_lines
