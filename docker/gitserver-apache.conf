<VirtualHost *:80>
    SetEnv GIT_PROJECT_ROOT /repos
    SetEnv GIT_HTTP_EXPORT_ALL 1
    SetEnv GIT_HTTP_RECEIVE_PACK 1

    ScriptAlias / /usr/lib/git-core/git-http-backend/

    <Directory "/usr/lib/git-core/">
        Options +ExecCGI
        Require all granted
    </Directory>
</VirtualHost>
