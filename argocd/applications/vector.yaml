apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://helm.vector.dev
    chart: vector
    targetRevision: ">=0.52.0 <1.0.0"
    helm:
      values: |
        role: Agent
        service:
          enabled: false
        tolerations:
          - effect: NoSchedule
            operator: Exists
          - effect: NoExecute
            operator: Exists
        customConfig:
          data_dir: /vector-data-dir
          sources:
            kubernetes_logs:
              type: kubernetes_logs
          transforms:
            kube_logs_parsed:
              type: remap
              inputs:
                - kubernetes_logs
              source: |
                .namespace = .kubernetes.pod_namespace
                .pod = .kubernetes.pod_name
                .container = .kubernetes.container_name
                .node_name = .kubernetes.pod_node_name
          sinks:
            loki:
              type: loki
              inputs:
                - kube_logs_parsed
              endpoint: http://loki.monitoring.svc.cluster.local:3100
              labels:
                namespace: "{{ `{{ namespace }}` }}"
                pod: "{{ `{{ pod }}` }}"
                container: "{{ `{{ container }}` }}"
                node_name: "{{ `{{ node_name }}` }}"
                source: "{{ `{{ source_type }}` }}"
              encoding:
                codec: text
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
