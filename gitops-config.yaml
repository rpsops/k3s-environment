# GitOps namespaces.
#
# Each entry creates:
#   - a Kubernetes Namespace
#   - a Flux GitRepository (HTTPS + PAT in Secret/gitops-credentials-<name>)
#   - a Flux Kustomization that deploys the repo contents into the namespace
#
# An empty list means no namespaces are created and no Flux sources are
# applied (the base infrastructure still comes up).
#
# Add an entry with:
#   make namespace NAME=<ns> URL=<https-clone-url> \
#                  GITOPS_USER=<user> GITOPS_TOKEN=<pat>
#
# Per-entry fields:
#   name             (required) DNS-1123 label, used as the namespace name
#   url              (required) HTTPS clone URL of the gitops repo
#   branch           (optional) defaults to "main"
#   interval         (optional) source poll interval, defaults to "1m"
#   path             (optional) path inside the repo, defaults to "./"
#   imageAutomation  (optional) if true, deploy a Flux ImageUpdateAutomation
#                    that commits image tag bumps back to this entry's repo.
#                    Requires the gitops repo to contain
#                    `# {"$imagepolicy": "flux-system:<policy>"}` markers.
#                    Defaults to false.
#
# Example:
#   namespaces:
#     - name: wallet
#       url: https://github.com/diggsweden/wallet-local-gitops.git
#       branch: main
#       interval: 1m
#       path: ./
#       imageAutomation: true
namespaces: []
