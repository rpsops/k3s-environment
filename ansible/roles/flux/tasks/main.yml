---
# --- Cilium CNI must be installed before anything else can schedule ---

- name: Install Gateway API CRDs
  ansible.builtin.command: >
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
  register: gwapi_apply
  changed_when: "'configured' in gwapi_apply.stdout or 'created' in gwapi_apply.stdout"

- name: Check if Cilium is installed
  ansible.builtin.command: helm status cilium -n kube-system
  register: cilium_check
  changed_when: false
  failed_when: false

- name: Install Cilium via Helm (CNI bootstrap - before Flux)
  when: cilium_check.rc != 0
  block:
    - name: Add Cilium Helm repo
      ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
      changed_when: false

    - name: Install Cilium
      ansible.builtin.command: >
        helm install cilium cilium/cilium
        --namespace kube-system
        --set operator.replicas=1
        --set ipam.mode=kubernetes
        --set kubeProxyReplacement=true
        --set k8sServiceHost=localhost
        --set k8sServicePort=6443
        --set gatewayAPI.enabled=true
        --set l2announcements.enabled=true
        --set externalIPs.enabled=true
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        --set hubble.metrics.enabled="{dns,drop,tcp,flow,icmp,http}"
        --set hubble.metrics.serviceMonitor.enabled=false
      changed_when: true

- name: Wait for nodes to be Ready (Cilium CNI active)
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready nodes --all --timeout=120s
  changed_when: false
  retries: 6
  delay: 15
  register: nodes_ready
  until: nodes_ready.rc == 0

# --- Flux ---

- name: Install Flux controllers
  ansible.builtin.command: >
    flux install
    --components-extra=image-reflector-controller
  register: flux_install
  changed_when: "'configured' in flux_install.stdout or 'created' in flux_install.stdout or flux_install.changed"

- name: Wait for Flux controllers to be ready
  ansible.builtin.command: flux check
  changed_when: false
  retries: 6
  delay: 10
  register: flux_check
  until: flux_check.rc == 0

# --- Infrastructure: sources + namespaces ---

- name: Apply HelmRepository sources
  ansible.builtin.command: kubectl apply -k {{ flux_base_path }}/infrastructure/sources
  register: sources_apply
  changed_when: "'configured' in sources_apply.stdout or 'created' in sources_apply.stdout"

- name: Apply namespaces
  ansible.builtin.command: kubectl apply -k {{ flux_base_path }}/infrastructure/namespaces
  register: ns_apply
  changed_when: "'configured' in ns_apply.stdout or 'created' in ns_apply.stdout"

- name: Force reconcile all Helm repositories
  ansible.builtin.shell: |
    flux reconcile source helm --all 2>/dev/null || true
    sleep 5
  changed_when: false

- name: Verify DNS works inside cluster
  ansible.builtin.shell: |
    kubectl run dns-verify --rm -i --restart=Never --image=busybox --timeout=30s -- \
      nslookup charts.jetstack.io 2>&1 | tail -3
  register: dns_verify
  changed_when: false
  failed_when: false

- name: Fix CoreDNS if DNS is broken
  when: "dns_verify.rc is defined and dns_verify.rc != 0"
  ansible.builtin.shell: |
    kubectl rollout restart daemonset cilium -n kube-system
    kubectl rollout restart deployment coredns -n kube-system
    sleep 20
    flux reconcile source helm --all 2>/dev/null || true

# --- cert-manager ---

- name: Apply cert-manager HelmRelease
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/cert-manager"
  register: cm_apply
  changed_when: "'configured' in cm_apply.stdout or 'created' in cm_apply.stdout"

- name: Wait for cert-manager to be ready
  ansible.builtin.command: flux get helmrelease cert-manager -n cert-manager
  changed_when: false
  retries: 15
  delay: 20
  register: cm_ready
  until: "'True' in cm_ready.stdout"

- name: Get mkcert CA root path
  ansible.builtin.command: mkcert -CAROOT
  register: mkcert_caroot
  changed_when: false

- name: Ensure mkcert CA exists
  ansible.builtin.command: mkcert -install
  args:
    creates: "{{ mkcert_caroot.stdout }}/rootCA.pem"
  changed_when: false
  environment:
    TRUST_STORES: nss

- name: Apply ClusterIssuer for mkcert CA
  ansible.builtin.command: kubectl apply -f {{ flux_base_path }}/infrastructure/cert-manager/clusterissuer.yaml
  register: ci_apply
  changed_when: "'configured' in ci_apply.stdout or 'created' in ci_apply.stdout"

- name: Create mkcert CA secret in cert-manager namespace
  ansible.builtin.shell: |
    kubectl create secret tls mkcert-ca \
      --cert="{{ mkcert_caroot.stdout }}/rootCA.pem" \
      --key="{{ mkcert_caroot.stdout }}/rootCA-key.pem" \
      -n cert-manager --dry-run=client -o yaml | kubectl apply -f -
  register: ca_secret
  changed_when: "'configured' in ca_secret.stdout or 'created' in ca_secret.stdout"

# --- OpenBao ---

- name: Apply OpenBao HelmRelease
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/openbao"
  register: openbao_apply
  changed_when: "'configured' in openbao_apply.stdout or 'created' in openbao_apply.stdout"

- name: Wait for OpenBao pod to be running (sealed pods are Running but not Ready)
  ansible.builtin.shell: |
    kubectl get pod openbao-0 -n openbao -o jsonpath='{.status.phase}' 2>/dev/null
  register: openbao_phase
  changed_when: false
  retries: 18
  delay: 10
  until: openbao_phase.stdout == "Running"

- name: Check OpenBao status
  ansible.builtin.shell: |
    kubectl exec -n openbao openbao-0 -- sh -c 'bao status -format=json 2>/dev/null; true' 2>/dev/null || echo '{}'
  register: openbao_status_raw
  changed_when: false
  failed_when: false

- name: Parse OpenBao status
  ansible.builtin.set_fact:
    openbao_initialized: "{{ (openbao_status_raw.stdout | from_json).initialized | default(false) }}"
    openbao_sealed: "{{ (openbao_status_raw.stdout | from_json).sealed | default(true) }}"

- name: Initialize OpenBao (first time only)
  when: not openbao_initialized
  block:
    - name: Run operator init
      ansible.builtin.shell: |
        kubectl exec -n openbao openbao-0 -- \
          bao operator init -key-shares=1 -key-threshold=1 -format=json
      register: openbao_init_result

    - name: Save init output to .local/
      ansible.builtin.copy:
        content: "{{ openbao_init_result.stdout }}"
        dest: "{{ playbook_dir }}/../.local/openbao-init.json"
        mode: '0600'

    - name: Set init data fact
      ansible.builtin.set_fact:
        openbao_init_data: "{{ openbao_init_result.stdout | from_json }}"

- name: Load saved init data for unseal
  ansible.builtin.set_fact:
    openbao_init_data: "{{ lookup('file', playbook_dir + '/../.local/openbao-init.json') | from_json }}"
  when: openbao_sealed and openbao_init_data | default(none) is none

- name: Unseal OpenBao
  when: openbao_sealed
  ansible.builtin.shell: |
    kubectl exec -n openbao openbao-0 -- \
      bao operator unseal {{ openbao_init_data.unseal_keys_b64[0] }}
  changed_when: true

- name: Configure OpenBao (first time only)
  when: not openbao_initialized
  block:
    - name: Enable KV v2 secret engine
      ansible.builtin.shell: |
        kubectl exec -n openbao openbao-0 -- \
          env VAULT_TOKEN={{ openbao_init_data.root_token }} \
          bao secrets enable -path=secret kv-v2
      changed_when: true

    - name: Enable Kubernetes auth method
      ansible.builtin.shell: |
        kubectl exec -n openbao openbao-0 -- \
          env VAULT_TOKEN={{ openbao_init_data.root_token }} \
          bao auth enable kubernetes
      changed_when: true

    - name: Configure Kubernetes auth to use in-cluster API
      ansible.builtin.shell: |
        kubectl exec -n openbao openbao-0 -- \
          env VAULT_TOKEN={{ openbao_init_data.root_token }} \
          bao write auth/kubernetes/config \
            kubernetes_host="https://kubernetes.default.svc.cluster.local:443"
      changed_when: true

    - name: Write ESO read policy
      ansible.builtin.shell: |
        kubectl exec -i -n openbao openbao-0 -- \
          env VAULT_TOKEN={{ openbao_init_data.root_token }} \
          bao policy write eso-read - <<'POLICY'
        path "secret/data/*"     { capabilities = ["read"] }
        path "secret/metadata/*" { capabilities = ["read", "list"] }
        POLICY
      changed_when: true

    - name: Create Kubernetes auth role for ESO service account
      ansible.builtin.shell: |
        kubectl exec -n openbao openbao-0 -- \
          env VAULT_TOKEN={{ openbao_init_data.root_token }} \
          bao write auth/kubernetes/role/eso \
            bound_service_account_names=external-secrets \
            bound_service_account_namespaces=external-secrets \
            policies=eso-read \
            ttl=1h
      changed_when: true

# --- External Secrets Operator ---

- name: Apply ESO HelmRelease only (CRDs not ready yet)
  ansible.builtin.command: >
    kubectl apply -f {{ flux_base_path }}/infrastructure/external-secrets/helmrelease.yaml
  register: eso_apply
  changed_when: "'configured' in eso_apply.stdout or 'created' in eso_apply.stdout"

- name: Wait for ESO HelmRelease to be ready
  ansible.builtin.command: flux get helmrelease external-secrets -n external-secrets
  changed_when: false
  retries: 20
  delay: 15
  register: eso_ready
  until: "'True' in eso_ready.stdout"

- name: Wait for ClusterSecretStore CRD to be registered
  ansible.builtin.command: kubectl get crd clustersecretstores.external-secrets.io
  changed_when: false
  retries: 12
  delay: 5
  register: crd_ready
  until: crd_ready.rc == 0

- name: Apply full ESO kustomization (CRDs now available)
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/external-secrets"
  register: eso_full_apply
  changed_when: "'configured' in eso_full_apply.stdout or 'created' in eso_full_apply.stdout"

# --- Write secrets to OpenBao ---

- name: Check for OpenBao init file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/openbao-init.json"
  register: openbao_init_file

- name: Fail if OpenBao init file is missing
  ansible.builtin.fail:
    msg: "No .local/openbao-init.json — run 'make up' to let OpenBao initialise, or 'make openbao-init' manually"
  when: not openbao_init_file.stat.exists

- name: Load OpenBao init data
  ansible.builtin.set_fact:
    openbao_init_data: "{{ lookup('file', playbook_dir + '/../.local/openbao-init.json') | from_json }}"

- name: Check if Grafana credentials exist in OpenBao
  ansible.builtin.shell: |
    kubectl exec -n openbao openbao-0 -- \
      env VAULT_TOKEN={{ openbao_init_data.root_token }} \
      bao kv get -format=json secret/grafana 2>/dev/null
  register: grafana_in_bao
  changed_when: false
  failed_when: false

- name: Write Grafana credentials to OpenBao
  when: grafana_in_bao.rc != 0
  ansible.builtin.shell: |
    PASSWORD=$(openssl rand -base64 16)
    kubectl exec -n openbao openbao-0 -- \
      env VAULT_TOKEN={{ openbao_init_data.root_token }} \
      bao kv put secret/grafana admin=admin "password=$PASSWORD"
  changed_when: true

# --- Deploy remaining infrastructure ---

- name: Apply infrastructure components (first pass)
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/{{ item }}"
  loop:
    - garage
    - monitoring
    - strimzi
    - registry
    - kyverno
    - git-server
  register: infra_apply
  changed_when: "'configured' in infra_apply.stdout or 'created' in infra_apply.stdout"
  failed_when: false

- name: Wait for infrastructure HelmReleases to be ready
  ansible.builtin.shell: |
    flux get helmreleases -A --no-header 2>/dev/null | grep -cv "True" || echo "0"
  register: hr_not_ready
  changed_when: false
  retries: 30
  delay: 20
  until: hr_not_ready.stdout | trim | int == 0
  failed_when: false

- name: Apply infrastructure components (second pass - CRDs now available)
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/{{ item }}"
  loop:
    - cilium
    - monitoring
  register: infra_apply2
  changed_when: "'configured' in infra_apply2.stdout or 'created' in infra_apply2.stdout"

# --- Build infrastructure + cosign ---

- name: Apply build infrastructure
  ansible.builtin.command: "kubectl apply -k {{ flux_base_path }}/infrastructure/builds"
  register: builds_apply
  changed_when: "'configured' in builds_apply.stdout or 'created' in builds_apply.stdout"
  failed_when: false

- name: Check for saved cosign signing key
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.local/cosign-key.yaml"
  register: cosign_key_file

- name: Check if cosign-key Secret already exists in cluster
  ansible.builtin.command: kubectl get secret cosign-key -n flux-system
  register: cosign_key_in_cluster
  changed_when: false
  failed_when: false

- name: Restore cosign signing key from .local/ (only if absent in cluster)
  when:
    - cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../.local/cosign-key.yaml
  register: cosign_key_restore
  changed_when: "'configured' in cosign_key_restore.stdout or 'created' in cosign_key_restore.stdout"

- name: Notice when no saved cosign key is available
  when:
    - not cosign_key_file.stat.exists
    - cosign_key_in_cluster.rc != 0
  ansible.builtin.debug:
    msg: >-
      No .local/cosign-key.yaml found.
      A fresh cosign keypair will be generated.
      Run 'make cosign-key-export' to persist it for future rebuilds.

- name: Generate cosign key pair if not exists
  ansible.builtin.shell: |
    if ! kubectl get secret cosign-key -n flux-system >/dev/null 2>&1; then
      COSIGN_PASSWORD="" cosign generate-key-pair k8s://flux-system/cosign-key
      echo "created"
    else
      echo "exists"
    fi
  register: cosign_key
  changed_when: "'created' in cosign_key.stdout"

# --- Status ---

- name: Show status
  ansible.builtin.shell: |
    echo "=== Git Sources ==="
    flux get sources git
    echo ""
    echo "=== Kustomizations ==="
    flux get kustomizations
    echo ""
    echo "=== HelmReleases ==="
    flux get helmreleases -A
  register: final_status
  changed_when: false

- name: Display status
  ansible.builtin.debug:
    var: final_status.stdout_lines
